# Optional. Without it, the lead says "deliver it" after approving a packet, and the delivery runs
# the same way. Copy to .github/workflows/rfr-deliver.yml in a repository that uses the rfr-process plugin
# (docs/specs/delivery-run.md in rules-for-robots, AC-16 and AC-17). After each push to the default
# branch, this lists the open deliveries (approved user documentation, no spec, none under way on
# another branch) and, only when there is one, starts the project's delivery routine with one
# request. When nothing is open it costs one short job and starts no session. It starts the first
# open delivery; that delivery's own merge runs this again for the next.
# Needs three steps only a person can do: create a routine in Claude Code on this repository whose
# prompt is /rfr-process:deliver with no feature name; add an API trigger to it and generate its
# token, which is shown once; and create an environment named `rfr-deliver` in the repository's
# settings, limit its deployment branches to the default branch, and store two secrets there: the
# routine's address, copied from its API trigger, as the environment secret RFR_DELIVER_ROUTINE, and
# its token as the environment secret RFR_DELIVER_TOKEN. Only a run on the default branch can then
# read the token, so a workflow added on another branch cannot. Until then the job says what is open and succeeds.
# Change `main` below if your default branch has another name.
name: deliver

on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time for the repository, and none cancelled, so two runs never race. That alone does
# not stop a second start: a delivery shows as under way only once its session pushes the spec. The
# marker below does: for 45 minutes after a delivery starts, a run starts no other for that feature,
# and by then the delivery has pushed its spec and shows as under way.
concurrency:
  group: rfr-deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    environment: rfr-deliver
    steps:
      # The whole history: a delivery is under way when another branch adds its spec, and the check
      # compares each remote branch with the default branch. It fetches every branch from origin
      # itself, with the credentials this checkout keeps.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # `main` follows rules-for-robots as it changes, and this job runs it with the routine's token
      # in its environment. A project that needs that fixed should pin `ref:` to a release tag or
      # commit.
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: main
          path: .rfr
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The marker of the last delivery started, from the most recent run that saved one.
      - uses: actions/cache/restore@v4
        with:
          path: .rfr-deliver
          key: rfr-deliver-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rfr-deliver-
      - name: Start a delivery if one is open
        env:
          RFR_DELIVER_ROUTINE: ${{ secrets.RFR_DELIVER_ROUTINE || vars.RFR_DELIVER_ROUTINE }}
          RFR_DELIVER_TOKEN: ${{ secrets.RFR_DELIVER_TOKEN }}
        run: node .rfr/checks/ci/deliver-on-merge.mjs . --marker .rfr-deliver/last.json
      - uses: actions/cache/save@v4
        if: hashFiles('.rfr-deliver/last.json') != ''
        with:
          path: .rfr-deliver
          key: rfr-deliver-${{ github.run_id }}-${{ github.run_attempt }}
