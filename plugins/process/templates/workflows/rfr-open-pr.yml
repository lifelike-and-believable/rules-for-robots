# Copy to .github/workflows/rfr-open-pr.yml in a repository that uses the rfr-process plugin
# (docs/specs/github-gate.md in rules-for-robots), or let `node .rfr/checks/process-github-setup.mjs
# --apply` copy it. When an agent pushes a branch, this opens the pull request as your GitHub App and
# turns on auto-merge. Because the App is the author, the person whose credentials the agent uses can
# give the approving review that a gated folder needs; a pull request that touches no gated folder
# merges itself when the checks pass.
# Needs: the App installed on this repository with Contents and Pull requests set to read and write,
# its ID in the Actions variable RFR_APP_ID, its private key in the Actions secret
# RFR_APP_PRIVATE_KEY, and "Allow auto-merge" turned on. Change `main` below if your default branch
# has another name, and the branch patterns if your agents use other names.
name: open-pr

on:
  push:
    branches: ['claude/**', 'phase-*/**', 'feature/**']

permissions:
  contents: read

concurrency:
  group: open-pr-${{ github.ref }}

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      # The App's token, not the workflow's own: a pull request opened with the workflow's token does
      # not start other workflows, so the checks would never run on it.
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RFR_APP_ID }}
          private-key: ${{ secrets.RFR_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Open the pull request and turn on auto-merge
        id: open
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.ref_name }}
          BASE: main
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            title=$(git log -1 --format=%s)
            gh pr create --head "$BRANCH" --base "$BASE" --title "$title" --body "Opened by the rfr-process workflow for branch \`$BRANCH\`."
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi
          gh pr merge "$number" --auto --merge
          echo "number=$number" >> "$GITHUB_OUTPUT"
      # The agent does not write the description, so build it from the branch: the review packet,
      # any design that lets a spec skip user documentation, the decisions the agent recorded, and
      # the line to approve with. Refreshed on every push; a failure here never fails the workflow.
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: lifelike-and-believable/rules-for-robots
          path: .rfr
      - uses: actions/setup-node@v5
        continue-on-error: true
        with:
          node-version: 22
      - name: Write the pull request's description
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.ref_name }}
          BASE: main
          NUMBER: ${{ steps.open.outputs.number }}
        run: |
          node .rfr/checks/ci/process-pr-body.mjs . --base "origin/$BASE" --number "$NUMBER" --branch "$BRANCH" > "$RUNNER_TEMP/body.md"
          gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md"
      # The title says what the pull request carries ("Deliver: ...", "Packet: ...", "Validate: ..."),
      # not its last commit. It is changed only while it is still one of the branch's commit
      # subjects, so a title a person has edited is kept.
      - name: Title the pull request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: main
          NUMBER: ${{ steps.open.outputs.number }}
        run: |
          title=$(node .rfr/checks/ci/process-pr-body.mjs . --base "origin/$BASE" --title)
          [ -n "$title" ] || exit 0
          current=$(gh pr view "$NUMBER" --json title --jq .title)
          [ "$current" = "$title" ] && exit 0
          if git log "origin/$BASE..HEAD" --format=%s | grep -Fxq -- "$current"; then
            gh pr edit "$NUMBER" --title "$title"
          fi
