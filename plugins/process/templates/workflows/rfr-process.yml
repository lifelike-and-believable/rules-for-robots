# Copy to .github/workflows/rfr-process.yml in a repository that uses the rfr-process plugin
# (docs/specs/project-process.md in rules-for-robots). Runs the process check, approvals, tier,
# CODEOWNERS, and issue sync jobs. Change `main` if your default branch has another name. In team
# mode, make the `process / approvals` and `process / tier` checks required in branch protection.
name: process

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

jobs:
  process:
    uses: lifelike-and-believable/rules-for-robots/.github/workflows/rfr-process.yml@main
    permissions:
      contents: read
      pull-requests: read
      issues: write
