# Copy to .github/workflows/rfr-process.yml in a repository that uses the rfr-process plugin
# (docs/specs/project-process.md in rules-for-robots). Runs the process check, approvals, change,
# CODEOWNERS, and issue sync jobs. Change `main` if your default branch has another name. Require the
# `process / process-trace` and `process / change` checks in branch protection (the GitHub gate's
# setup script does this).
name: process

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

jobs:
  process:
    # @main follows rules-for-robots as it changes. For stable CI, pin this and rules-ref below to
    # the same release tag or commit.
    uses: lifelike-and-believable/rules-for-robots/.github/workflows/rfr-process.yml@main
    # with:
    #   rules-ref: <the same tag or commit>
    #   typecheck: npm run check        # the project's type check, run on every pull request
    #   install-dirs: sanity-studio     # folders with their own package.json, installed after the root
    permissions:
      contents: read
      pull-requests: read
      issues: write
    # Passes RFR_PROJECT_TOKEN, if you have set it, for the Project board (see process.yml's project).
    secrets: inherit
