# Feedback from a project that uses rules-for-robots (docs/specs/feedback.md). The rfr-feedback
# plugin's report-feedback skill fills this form in through a link, or files the same fields with gh.
# Field IDs must match FIELDS in plugins/feedback/scripts/feedback.mjs.
name: Feedback from a project
description: Something a project using rules-for-robots found, with what you would change.
title: "Feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        This repository is public, so this issue will be too. Describe the problem in general terms: leave out names, private links, code, content, and anything else that is not yours to publish.
  - type: input
    id: area
    attributes:
      label: Area
      description: |
        Optional; leave it blank if you are not sure, and the maintainer will assign it. rfr-core: the coding rules, the review and audit skills, and the reviewer agents. rfr-process: the development process (stories, designs, specs, tutorials), its checks (process-trace, spec-trace, spec-lock, tutorial-run), and the reusable CI workflows. rfr-feedback: this form and the report-feedback skill. rules: the rule files themselves. evals: the evaluations. profiles: a suggested new profile or domain plugin, for a kind of project the existing ones (web-app, static-site, unreal-plugin, general) do not fit; say what kind of project, what it had to borrow or do without, and why. other: anything else.
      placeholder: rfr-process
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The rfr-core and rfr-process versions, or the rules-for-robots commit you were using.
      placeholder: rfr-core 2.2.2, rfr-process 0.10.5
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, what the process, check, or skill did, and what you expected.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The message, output, or a minimal example that shows it, with private details removed.
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: What you would change, if you have an idea.
  - type: input
    id: source
    attributes:
      label: Kind of project
      description: Optional, in general terms, for example "a static site in solo mode".
