name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Plugin validation needs the Claude Code CLI; no API key is used.
      - run: npm install --global @anthropic-ai/claude-code@^2.1.288
      - run: npm run verify

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose

  status:
    # One comment on the pull request when CI finishes, naming the head commit, so whoever
    # waits on CI is notified instead of polling. Confirm checks on the current head before merging.
    needs: [verify, secret-scan]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/rfr-ci-status.yml
    with:
      results: ${{ toJSON(needs) }}
      rules-ref: ${{ github.event.pull_request.head.sha || github.sha }}
