name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Plugin validation needs the Claude Code CLI; no API key is used.
      - run: npm install --global @anthropic-ai/claude-code@^2.1.288
      - run: npm run verify
