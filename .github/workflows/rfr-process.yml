name: rules-for-robots process check

# Reusable workflow for repositories that use the rfr-process plugin
# (docs/specs/project-process.md). Copy the caller from
# plugins/process/templates/workflows/rfr-process.yml, which runs it on pull requests and on
# pushes to the default branch. On pull requests the check also compares with the base, so an
# artifact withdrawn without a reason fails (rule 7). On the default branch a failure opens an
# issue labelled `stale`, or comments on the open one, because two pull requests that each pass
# can leave the branch stale once both merge; the issue is assigned to the approvers of the stages
# involved. The other jobs:
#   approvals   agent-gated stages need a recorded independent review on the head; after a merge,
#               notify-gated stages open a decision-queue issue. The approver's review of an approve
#               stage is GitHub's (branch protection; docs/specs/github-gate.md).
#   change      a pull request that changes source belongs to a feature with an approved spec, or
#               declares a fix or a trivial change in a commit message; reports its kind as an output.
#   codeowners  the rfr-process block in .github/CODEOWNERS matches process.yml (team mode).
#   sync        after a merge, personas, epics, and stories are mirrored to issues, and, with
#               `project` in process.yml and the RFR_PROJECT_TOKEN secret, placed on that Project.
#   tutorials   every tutorial names its runner, web tutorials use steps the runner can perform,
#               and an automation test cites each Unreal tutorial. Running web tutorials against
#               the product needs it deployed, so that step belongs in the project's own e2e job:
#               node .rfr/checks/tutorial-run.mjs . --base-url <url>, or the
#               rfr-tutorials-preview.yml workflow against a preview deployment.
#   docs-lint   advisory: Vale with the RFR style and the project's persona and glossary terms on
#               docs/user, docs/tutorials, and docs/releases; alerts go to the job summary.
#   mutation    advisory, with `mutation: true` (web-app and static-site): Stryker on feature
#               pull requests (the change job's kind), incremental from the pull request's earlier runs, in full
#               when test files change; the score and surviving mutants go to the job summary.
#   typecheck   with `typecheck: <command>`: the project's type check on every pull request, so a
#               type error in a test shows before review, not only in a later local run.
#   Both install the root package with npm ci, then each folder in `install-dirs`.
# Every job passes without doing anything when the repository has no docs/product/process.yml.
on:
  workflow_call:
    inputs:
      rules-ref:
        description: rules-for-robots ref to take the check from
        type: string
        default: main
      mutation:
        description: Run the advisory Stryker job (needs stryker.config.mjs and Stryker in the project's dev dependencies)
        type: boolean
        default: false
      lasting-tutorials:
        description: "`warn` reports the lasting-tutorial rules (docs/specs/lasting-tutorials.md, AC-2 and AC-9) as warnings, for tutorials written before them; `fail` fails the check. The default becomes `fail` when slice 27d is done."
        type: string
        default: warn
      typecheck:
        description: Command for the project's type check (for example `npm run check` or `npx tsc --noEmit`); when set, the typecheck job runs it on every pull request
        type: string
        default: ''
      install-dirs:
        description: Space-separated folders with their own package.json to install after the root (for example `sanity-studio`), for the mutation and typecheck jobs
        type: string
        default: ''
    secrets:
      RFR_PROJECT_TOKEN:
        description: Token with write access to the GitHub Project named in process.yml (optional; without it the board is skipped)
        required: false

permissions:
  contents: read

jobs:
  process-trace:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: ${{ inputs.rules-ref }}
          path: .rfr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Process check
        env:
          RFR_LASTING_TUTORIALS: ${{ inputs.lasting-tutorials }}
        run: |
          set -o pipefail
          node .rfr/checks/process-trace.mjs . ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || '' }} 2>&1 | tee "$RUNNER_TEMP/process-trace.txt"
      - name: Open or update the stale issue
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "The process check failed on \`$REF_NAME\` after a merge ([run]($RUN_URL))."
            echo "Each stale or broken link below needs its artifact updated, re-recorded, or withdrawn."
            echo
            echo '```'
            cat "$RUNNER_TEMP/process-trace.txt"
            echo '```'
          } > "$RUNNER_TEMP/stale-issue.md"
          gh label create stale --color FBCA04 --description "Process artifacts with stale links" 2>/dev/null || true
          assignees=$(node .rfr/checks/process-trace.mjs . --assignees || true)
          number=$(gh issue list --label stale --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/stale-issue.md"
          else
            number=$(gh issue create --title "Stale process artifacts on $REF_NAME" --label stale --body-file "$RUNNER_TEMP/stale-issue.md" | grep -o '[0-9]*$')
          fi
          if [ -n "$assignees" ] && [ -n "$number" ]; then
            gh issue edit "$number" --add-assignee "$assignees" || echo "Could not assign $assignees (they need access to the repository)."
          fi

  approvals:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: ${{ inputs.rules-ref }}
          path: .rfr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .rfr/checks/ci/process-approvals.mjs .

  # Retired in rewrite plan 25e: the change job reads a fix or trivial claim from the commits. This
  # stub passes so that a repository that still requires `process / tier` is not blocked; remove it
  # from the required checks, and the stub goes in 8.0.0.
  tier:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tier check retired
        run: echo "::notice::process / tier is retired (rules-for-robots rewrite plan 25e); the change job checks fix and trivial claims. Remove process / tier from this repository's required checks."

  # A pull request that changes source belongs to a feature with an approved spec, or declares
  # itself a fix or a trivial change in a commit message (docs/specs/process-state.md).
  change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.change.outputs.kind }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: ${{ inputs.rules-ref }}
          path: .rfr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Change check
        id: change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .rfr/checks/ci/process-change.mjs .

  codeowners:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: ${{ inputs.rules-ref }}
          path: .rfr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: CODEOWNERS block
        run: node .rfr/checks/process-codeowners.mjs . --check

  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: ${{ inputs.rules-ref }}
          path: .rfr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Issue sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RFR_PROJECT_TOKEN: ${{ secrets.RFR_PROJECT_TOKEN }}
        run: node .rfr/checks/ci/process-sync.mjs .

  tutorials:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: ${{ inputs.rules-ref }}
          path: .rfr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tutorial runners and coverage
        env:
          RFR_LASTING_TUTORIALS: ${{ inputs.lasting-tutorials }}
        run: node .rfr/checks/tutorial-run.mjs . --coverage

  docs-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: ${{ inputs.rules-ref }}
          path: .rfr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vale on user documentation, tutorials, and release notes
        run: |
          if [ ! -f docs/product/process.yml ]; then echo "No docs/product/process.yml; nothing to lint."; exit 0; fi
          vale=$(node .rfr/checks/ci/install-vale.mjs)
          mapfile -t prepared < <(node .rfr/checks/process-vale.mjs . --out "$RUNNER_TEMP/vale")
          config="${prepared[0]}"
          paths=("${prepared[@]:1}")
          if [ ${#paths[@]} -eq 0 ]; then echo "No docs/user, docs/tutorials, or docs/releases yet."; exit 0; fi
          "$vale" --config "$config" --output line --no-exit "${paths[@]}" | tee "$RUNNER_TEMP/vale.txt"
          {
            echo "### Docs lint (advisory)"
            if [ -s "$RUNNER_TEMP/vale.txt" ]; then
              echo "Vale found $(wc -l < "$RUNNER_TEMP/vale.txt") alert(s). They do not fail the build; fix the ones a reader would trip on."
              echo
              echo '```'
              cat "$RUNNER_TEMP/vale.txt"
              echo '```'
            else
              echo "No alerts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  mutation:
    # The kind comes from the change job: a source change that belongs to a feature (rewrite plan 25e).
    needs: change
    if: >-
      !cancelled() && inputs.mutation && github.event_name == 'pull_request' &&
      needs.change.outputs.kind == 'feature'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: lifelike-and-believable/rules-for-robots
          ref: ${{ inputs.rules-ref }}
          path: .rfr
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The incremental file from earlier runs on this pull request. The first run on a pull request
      # is a full run; later pushes only test the mutants their changes affect.
      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ github.event.pull_request.number }}-
      - run: npm ci
      - name: Install other packages
        if: inputs.install-dirs != ''
        env:
          INSTALL_DIRS: ${{ inputs.install-dirs }}
        run: |
          for dir in $INSTALL_DIRS; do
            echo "npm ci in $dir"
            npm ci --prefix "$dir"
          done
      - name: Stryker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A change to a test file reruns every mutant, so the score reflects the new tests.
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '(\.(test|spec)\.[cm]?[jt]sx?$|(^|/)(tests?|e2e|__tests__)/)'; then
            echo "Test files changed: full run."
            npx stryker run --incremental --force
          else
            npx stryker run --incremental
          fi
      - name: Mutation score
        if: always()
        run: |
          if [ -f reports/mutation/mutation.json ]; then
            node .rfr/checks/ci/mutation-summary.mjs reports/mutation/mutation.json >> "$GITHUB_STEP_SUMMARY"
            node .rfr/checks/ci/mutation-summary.mjs reports/mutation/mutation.json --annotate
          else
            echo "Stryker wrote no report (reports/mutation/mutation.json); see the Stryker step." >> "$GITHUB_STEP_SUMMARY"
          fi

  typecheck:
    if: inputs.typecheck != '' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Install other packages
        if: inputs.install-dirs != ''
        env:
          INSTALL_DIRS: ${{ inputs.install-dirs }}
        run: |
          for dir in $INSTALL_DIRS; do
            echo "npm ci in $dir"
            npm ci --prefix "$dir"
          done
      - name: Type check
        env:
          TYPECHECK: ${{ inputs.typecheck }}
        run: bash -c "$TYPECHECK"
