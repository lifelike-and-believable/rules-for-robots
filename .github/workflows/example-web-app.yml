name: Example web app

# Runs the reference web app's own checks: verify, bundle budget, end-to-end and
# accessibility tests, and Lighthouse CI against a local production build.
on:
  pull_request:
    paths: [examples/web-app/**, .github/workflows/example-web-app.yml]
  push:
    branches: [main]
    paths: [examples/web-app/**, .github/workflows/example-web-app.yml]

permissions:
  contents: read

defaults:
  run:
    working-directory: examples/web-app

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/web-app/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npx size-limit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Lighthouse CI (median of 3 runs)
        run: |
          npx next start -p 3000 &
          npx --yes wait-on http://localhost:3000
          npx --yes @lhci/cli autorun --collect.url=http://localhost:3000/ --collect.url=http://localhost:3000/products
