name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # astro check, unit tests, and astro build (TS-001, WA-001)
      - run: npm run verify
      # per-route JavaScript budgets (WEB-003)
      - run: npx size-limit
