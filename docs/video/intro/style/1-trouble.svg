    <text x="110" y="190" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="92" font-weight="700" fill="#2A1A14" text-anchor="start" >So you write rules.</text><text x="110" y="286" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="64" font-weight="700" fill="#6B665E" text-anchor="start" >Now it asks about everything.</text>
